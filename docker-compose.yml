version: "3.8"

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: bible-chatbot-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bible_chatbot}
      MYSQL_USER: ${MYSQL_USER:-bibleuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-biblepass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - bible-chatbot-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-rootpassword}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bible-chatbot-backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-bibleuser}:${MYSQL_PASSWORD:-biblepass}@database:3306/${MYSQL_DATABASE:-bible_chatbot}

      # JWT
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # AstraDB
      ASTRADB_ENDPOINT: ${ASTRADB_ENDPOINT}
      ASTRADB_APPLICATION_TOKEN: ${ASTRADB_APPLICATION_TOKEN}

      # Groq API
      GROQ_API_KEY: ${GROQ_API_KEY}

      # LangChain
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-true}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-bible-chatbot}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - backend_logs:/app/logs
    networks:
      - bible-chatbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: bible-chatbot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bible-chatbot-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/",
        ]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  mysql_data:
    driver: local
  backend_logs:
    driver: local

networks:
  bible-chatbot-network:
    driver: bridge
