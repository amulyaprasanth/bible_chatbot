[project]
name = "bible-chatbot"
version = "0.1.0"
description = ""
authors = [
    {name = "amulyaprasanth",email = "amulyaprasanth301@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "fastapi[standard] (>=0.120.0,<0.121.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "pymysql (>=1.1.2,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "langchain (>=1.0.2,<2.0.0)",
    "langchain-groq (>=1.0.0,<2.0.0)",
    "google-auth (>=2.41.1,<3.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "langchain-astradb (>=1.0.0,<2.0.0)",
    "langchain-huggingface (>=1.0.0,<2.0.0)",
    "sentence-transformers (>=5.1.2,<6.0.0)",
    "langchain-community (>=0.4,<0.5)",
    "langchain-text-splitters (>=1.0.0,<2.0.0)",
    "wikipedia (>=1.4.0,<2.0.0)",
    "duckduckgo-search (>=8.1.1,<9.0.0)",
    "ddgs (>=9.6.1,<10.0.0)",
    "cryptography (>=46.0.3,<47.0.0)",
    "google-auth-oauthlib (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    {include = "src"}
]